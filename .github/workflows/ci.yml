name: EcoGraph Lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 matplotlib numpy openpyxl Pillow python-docx reportlab

      - name: Compile source
        run: python -m py_compile EcoGraphLab_v51_3.py

      - name: Check application version
        run: python EcoGraphLab_v51_3.py --version

      - name: Run full offscreen self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -u EcoGraphLab_v51_3.py --self-test
